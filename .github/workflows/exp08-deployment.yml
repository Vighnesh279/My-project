name: EXP-08 Automated Deployment Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'EXP-08-Automated-Deployment-Pipeline/**'
      - '.github/workflows/exp08-deployment.yml'

permissions:
  contents: read

jobs:
  build-test-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: EXP-08-Automated-Deployment-Pipeline

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./EXP-08-Automated-Deployment-Pipeline
          file: ./EXP-08-Automated-Deployment-Pipeline/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mywebapp:${{ github.sha }}